version: '3.7'

services:
  dump1090-fa:
    # build: ./dump1090-fa
    image: vsrv-01.local:5443/vkorobov/dump1090-fa:${PIAWARE_VERSION}
    container_name: dump1090-fa
    devices:
      - "/dev/bus/usb"
    ports:
      - 8080:8080
      - 30001-30005:30001-30005
      # - 30002:30003
      # - 30003:30003
      # - 30004:30004
      # - 30005:30005 
      - 30104:30104
    environment:
      - LAT=${LAT}
      - LON=${LON}
    volumes:
      - ./stat/dump1090-fa:/run/dump1090-fa
      - ./log/dump1090-fa.log:/var/log/dump1090-fa.log
    restart: always
    logging:
      driver: journald
